worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server_names_hash_bucket_size 64;
    client_max_body_size 128M;

    sendfile        on;
    keepalive_timeout  65;

    include sites-enabled/*.conf;
}
